<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ticket2MD</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body data-state="idle">
    <main>
      <h1>Export ticket to MD</h1>

      <section data-panel="idle">
        <label>
          <input type="checkbox" id="anonymize" checked />
          Anonymize names
        </label>
        <button id="export-btn" class="contrast">Export</button>
      </section>

      <section data-panel="progress" aria-busy="true" aria-live="polite">
        <p>Exporting…</p>
      </section>

      <section data-panel="success" aria-live="polite">
        <p class="state-success">Export completed successfully.</p>
      </section>

      <section data-panel="error" aria-live="polite">
        <p class="state-error">Export failed</p>
        <details>
          <summary>Details</summary>
          <ul id="error-details">
            <li>02-screenshot.png — download failed (link expired)</li>
          </ul>
        </details>
      </section>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
